name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04]
        node: [22]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Run linter 👀
        run: pnpm lint

      - name: Run tests 🧪
        run: pnpm test
